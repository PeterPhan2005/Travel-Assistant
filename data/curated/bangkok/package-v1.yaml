    content: >-
      Wat Arun Ratchawararam nằm ở bờ tây sông Chao Phraya, trên đường Arun
      Amarin thuộc Bangkok Yai. Tourism Authority of Thailand giới thiệu đây là
      một ngôi chùa có nguồn gốc từ thời Ayutthaya và gắn với triều Rama II.
      Cụm prang cao được xây bằng gạch sáng màu, trang trí bằng vỏ sò, mảnh sứ
      và đồ gốm, tạo bề mặt thay đổi theo ánh sáng. Dù hình ảnh ngọn tháp thường
      đại diện cho Bangkok, đây trước hết là một cơ sở Phật giáo đang hoạt động.
      Khách nên mặc trang phục lịch sự, nói nhỏ, đi theo lối được phép và tôn
      trọng người hành lễ. Khi quan sát từ sông hoặc leo khu được mở, hãy tuân
      thủ biển an toàn thay vì tìm góc chụp vượt rào.
