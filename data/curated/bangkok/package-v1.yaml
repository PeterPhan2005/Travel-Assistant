narrations:
  - id: bkk-narration-bangkok-art-and-culture-centre-vi
    city_code: bkk
    poi_id: bkk-poi-bangkok-art-and-culture-centre
    source_id: bkk-source-bacc-about
    language_code: vi-VN
    content: >-
      Bangkok Art and Culture Centre nằm tại nút giao Pathum Wan, đối diện MBK
      Center và Siam Discovery. Trang chính thức cho biết trung tâm mở cửa từ
      năm 2008 sau nhiều năm vận động của mạng lưới nghệ sĩ và người yêu nghệ
      thuật, với sự hỗ trợ của Bangkok Metropolitan Administration. Không gian
      này hướng tới nghệ thuật hiện đại và đương đại, gồm các phòng triển lãm,
      thư viện, khu hoạt động và những chương trình luân phiên. Vì nội dung thay
      đổi theo thời điểm, khách nên xem lịch chính thức trước khi đến thay vì
      dựa vào một danh sách trưng bày cũ. Trong phòng triển lãm, hãy tuân thủ
      biển hướng dẫn về chụp ảnh, không chạm tác phẩm và giữ lối đi chung cho
      người xem khác.
    verification_status: verified
  - id: bkk-narration-bangkok-national-museum-vi
    city_code: bkk
    poi_id: bkk-poi-bangkok-national-museum
    source_id: bkk-source-bangkok-national-museum
    language_code: vi-VN
    content: >-
      Bangkok National Museum nằm trên đường Na Phra That trong khu Phra Nakhon.
      Cơ quan Fine Arts Department giới thiệu đây là bảo tàng công cộng đầu tiên
      của Thái Lan, đặt trong quần thể từng là Wang Na, tức cung điện của Phó
      vương. Các không gian gồm điện, sảnh và nhà nguyện, vì vậy bản thân kiến
      trúc cũng là một phần của chuyến tham quan chứ không chỉ là vỏ chứa hiện
      vật. Bộ sưu tập trải qua nhiều giai đoạn lịch sử và nghệ thuật Thái; nên
      chọn một tuyến chủ đề, đọc nhãn hiện vật và phân biệt vật gốc với phần
      diễn giải. Lịch mở cửa hoặc phòng trưng bày có thể thay đổi, vì thế hãy
      kiểm tra thông báo của bảo tàng trước chuyến đi.
    verification_status: verified
  - id: bkk-narration-benjakitti-park-vi
    city_code: bkk
    poi_id: bkk-poi-benjakitti-park
    source_id: bkk-source-benjakitti-bma
    language_code: vi-VN
    content: >-
      Benjakitti Park là công viên cấp khu vực ở Khlong Toei, nằm trên phần đất
      của nhà máy thuốc lá cũ cạnh Queen Sirikit National Convention Center.
      Bangkok Metropolitan Administration mô tả nơi đây như một công viên rừng
      sinh thái, đồng thời là không gian giữ nước mưa, hỗ trợ xử lý nước và giảm
      hiệu ứng đảo nhiệt đô thị. Hệ thống đường đi bộ, đường chạy, khu quan sát
      thiên nhiên và mặt nước tạo nhiều cách trải nghiệm hơn một bãi cỏ nghỉ
      chân thông thường. Khách nên đi đúng làn, không cản người tập thể dục và
      tuân thủ quy định tại từng khu vực, đặc biệt ở lối trên cao hoặc khu sinh
      thái. Thời tiết Bangkok nóng ẩm, nên chuẩn bị nước và chống nắng.
    verification_status: verified
  - id: bkk-narration-chao-phraya-sky-park-vi
    city_code: bkk
    poi_id: bkk-poi-chao-phraya-sky-park
    source_id: bkk-source-chao-phraya-sky-park-bma
    language_code: vi-VN
    content: >-
      Chao Phraya Sky Park nằm trên phần giữa của cầu Phra Pok Klao, nối hai bờ
      sông Chao Phraya. Bangkok Metropolitan Administration cho biết dự án cải
      tạo một kết cấu giao thông chưa sử dụng thành lối đi và không gian xanh,
      đồng thời thuộc định hướng phục hồi khu phố cổ Kudi Chin–Khlong San. Từ
      giữa cầu, khách có thể quan sát dòng sông và cảnh quan đô thị theo nhiều
      hướng mà không cần vào một đài quan sát thương mại. Đây vẫn là không gian
      công cộng hẹp, nên hãy đi gọn, không chặn lối và tôn trọng người tập thể
      dục hoặc di chuyển qua cầu. Nắng, mưa và gió ảnh hưởng trực tiếp đến trải
      nghiệm; nên kiểm tra điều kiện thực tế trước khi lên cầu.
    verification_status: verified
  - id: bkk-narration-chatuchak-weekend-market-vi
    city_code: bkk
    poi_id: bkk-poi-chatuchak-weekend-market
    source_id: bkk-source-chatuchak-bma
    language_code: vi-VN
    content: >-
      Chatuchak Weekend Market nằm trên đường Kamphaeng Phet 2 trong quận
      Chatuchak. Trang không gian công cộng của Bangkok Metropolitan
      Administration mô tả chợ có nhiều nhóm hàng, từ cây cối, quần áo và đồ
      dùng đến thực phẩm tươi hoặc chế biến. Hoạt động bán hàng tổng hợp và khu
      cây cảnh không cùng lịch, vì vậy không nên giả định mọi khu đều mở giống
      nhau mỗi ngày. Quy mô lớn và nhiều lối rẽ khiến việc chọn trước một nhóm
      hàng hoặc một cổng gặp nhau hữu ích hơn cố đi hết chợ. Khi tham quan, hãy
      giữ đồ cá nhân cẩn thận, không cản lối giao hàng, hỏi rõ giá trước khi mua
      và xin phép nếu muốn chụp cận cảnh người bán.
    verification_status: verified
  - id: bkk-narration-grand-palace-vi
    city_code: bkk
    poi_id: bkk-poi-grand-palace
    source_id: bkk-source-grand-palace-history
    language_code: vi-VN
    content: >-
      The Grand Palace nằm trên đường Na Phra Lan ở Phra Nakhon. Theo Bureau of
      the Royal Household, quần thể được xây dựng sau khi kinh đô chuyển sang bờ
      đông sông Chao Phraya năm 1782. Bên trong có các điện ở, điện thiết triều,
      công trình hành chính và Wat Phra Kaew, ngôi đền hoàng gia thờ Emerald
      Buddha. Vì đây là quần thể cung điện và tôn giáo vẫn gắn với nghi lễ,
      khách cần mặc trang phục phù hợp, đi theo khu vực được mở và giữ thái độ
      trang trọng. Sơ đồ rộng, nhiều lớp sân và công trình có chức năng khác
      nhau; nên đọc biển giới thiệu theo thứ tự thay vì coi toàn bộ nơi đây là
      một tòa nhà duy nhất. Hãy kiểm tra lịch chính thức trước khi đến.
    verification_status: verified
  - id: bkk-narration-king-power-mahanakhon-vi
    city_code: bkk
    poi_id: bkk-poi-king-power-mahanakhon
    source_id: bkk-source-king-power-mahanakhon-location
    language_code: vi-VN
    content: >-
      King Power Mahanakhon nằm trên đường Naradhiwas Rajanagarindra, gần ga BTS
      Chong Nonsi ở Bang Rak. Trang chính thức giới thiệu Mahanakhon SkyWalk với
      khu quan sát trong nhà ở tầng 74, khu ngoài trời ở tầng 78 và tầm nhìn 360
      độ qua Bangkok. Sàn kính là một khu trải nghiệm có quy định riêng; khách
      phải dùng bao giày và để đồ rời, kể cả điện thoại, ngoài bề mặt kính. Tầm
      nhìn thực tế phụ thuộc mưa, mây và chất lượng không khí, nên ảnh quảng bá
      không bảo đảm điều kiện tại thời điểm đến. Hãy kiểm tra giờ vào cuối,
      điều kiện vận hành và vé trên kênh chính thức, đồng thời cân nhắc thời tiết
      trước khi chọn khu quan sát ngoài trời.
    verification_status: verified
  - id: bkk-narration-pak-khlong-talat-vi
    city_code: bkk
    poi_id: bkk-poi-pak-khlong-talat
    source_id: bkk-source-pak-khlong-talat-bma
    language_code: vi-VN
    content: >-
      Pak Khlong Talat là khu chợ hoa và nông sản gần đường Chak Phet, bến sông
      và ga MRT Sanam Chai. Tài liệu của Bangkok Metropolitan Administration
      ghi lại quá trình nơi đây chuyển từ điểm giao thương đường thủy và chợ cá
      thành trung tâm rau, quả và hoa. Khu vực hiện gồm nhiều phần chợ khác nhau,
      với hoạt động giao hàng bằng xe và thuyền đặc biệt nhộn nhịp trước bình
      minh. Đây là nơi buôn bán đang vận hành, không phải một trường quay được
      dàn dựng. Khách nên đi gọn, tránh cản người vận chuyển, hỏi trước khi chụp
      người bán và không tự diễn giải mọi hoạt động quan sát được thành phong
      tục. Có thể kết hợp chuyến đi với bờ sông hoặc Sanam Chai.
    verification_status: verified
  - id: bkk-narration-thailand-cultural-centre-vi
    city_code: bkk
    poi_id: bkk-poi-thailand-cultural-centre
    source_id: bkk-source-thailand-cultural-centre
    language_code: vi-VN
    content: >-
      Thailand Cultural Centre nằm trên đường Thiam Ruam Mit ở Huai Khwang và
      thuộc Department of Cultural Promotion. Nguồn chính thức mô tả đây là
      trung tâm giáo dục công chúng về nghệ thuật và văn hóa, tổ chức biểu diễn,
      hoạt động văn hóa, triển lãm thay đổi, trưng bày thường xuyên và thư viện.
      Hai không gian chính là Main Hall và Small Hall, phục vụ những quy mô và
      hình thức sự kiện khác nhau. Vì chương trình phụ thuộc từng đơn vị tổ
      chức, việc có mặt tại tòa nhà không đồng nghĩa luôn có một buổi diễn để
      xem. Hãy kiểm tra lịch, điều kiện vé và cửa vào trên kênh của trung tâm,
      đến sớm nếu có chỗ ngồi được đánh số và giữ yên lặng trong phần trình
      diễn.
    verification_status: verified
  - id: bkk-narration-thipsamai-pratu-phi-vi
    city_code: bkk
    poi_id: bkk-poi-thipsamai-pratu-phi
    source_id: bkk-source-thipsamai-contact
    language_code: vi-VN
    content: >-
      Thipsamai Pratu Phi là địa điểm của Thipsamai tại số 313–315 Maha Chai
      Road, khu Samran Rat thuộc Phra Nakhon. Trang chính thức giới thiệu nhiều
      biến thể pad thai, gồm bản cơ bản, bản chay, bản dùng dầu tôm và các lựa
      chọn có tôm biển hoặc trứng. Danh sách món trên trang không phải bằng
      chứng rằng mọi món luôn còn tại mọi thời điểm, và dữ liệu canonical này
      không lưu giá khi chưa có một mức giá rõ ràng cho đúng chi nhánh. Khi gọi
      món, nên xác nhận thành phần, khẩu phần và giá trực tiếp tại quầy, nhất là
      nếu có dị ứng hoặc yêu cầu ăn chay. Giờ phục vụ cũng nên được kiểm tra lại
      từ kênh chính thức trước khi đến.
