    content: >-
      Wat Pho có tên chính thức là Wat Phra Chetuphon Wimon Mangkhalaram, nằm
      trên đường Sanam Chai ở Phra Nakhon, gần The Grand Palace. Trang của chùa
      hướng dẫn khách tiếp cận quần thể qua khu cổng dành cho tham quan. Không
      gian nổi tiếng với tượng Phật nằm, nhưng còn có nhiều sân, tháp chedi,
      điện thờ và chi tiết trang trí cần được xem theo từng khu vực. Đây là nơi
      thờ tự đang hoạt động, không chỉ là điểm chụp ảnh; khách nên ăn mặc lịch
      sự, giữ giọng nhỏ, không chắn lối trước ban thờ và tuân thủ biển hạn chế
      chụp ảnh. Lịch nghi lễ hoặc vận hành có thể ảnh hưởng quyền tiếp cận, vì
      vậy hãy kiểm tra thông tin chính thức trước khi đến.
